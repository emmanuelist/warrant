[package]
name = "options"
description = "Warrant: options that can't default and need no oracle: the collateral is locked inside NEAR Intents until expiry."
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.97"
license = "MIT"
# Embedded in the NEP-330 `contract_source_metadata` view at build time.
repository = "https://github.com/emmanuelist/warrant"

[lib]
crate-type = ["cdylib", "rlib"]

# fields to configure build with WASM reproducibility, according to specs
# in https://github.com/near/NEPs/blob/master/neps/nep-0330.md
[package.metadata.near.reproducible_build]
# Same image that built the live intents.near (its NEP-330 metadata, docs/CONTEXT.md).
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
# tag after colon above serves only descriptive purpose; image is identified by digest
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
# list of environment variables names, whose values, if set, will be used as external build parameters
# in a reproducible manner
passed_env = []
# build command inside of docker container
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--abi-features",
    "abi",
]

[features]
# ABI generation only (`cargo near build … --abi-features abi`): defuse-nep245's `Token` derives
# its JSON schema behind its own `abi` feature.
abi = ["defuse-nep245/abi"]

[dependencies]
near-sdk = "5.29.1"
# NEP-245 types, traits and events: the same crate intents.near uses, pinned to its deployed commit.
defuse-nep245 = { git = "https://github.com/near/intents", rev = "16d04f6ec4401263f8914638710260da50bb46b0", features = ["near-contract"] }

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing"] }
near-sandbox = "0.3.12"
near-api = "0.8"
cargo-near-build = "0.11.0"
tokio = { version = "1.12.0", features = ["full"] }
testresult = "0.4.1"
sha2 = "0.10"
bs58 = "0.5"
# An EVM wallet's personal_sign in tests/common/evm.rs (D-030): keccak256 + recoverable secp256k1.
sha3 = "0.10"
secp256k1 = { version = "0.27", features = ["recovery"] }

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations https://stackoverflow.com/a/64136471/249801
overflow-checks = true

# `cfg(near)` was introduced in `near-sdk` v5.27.0, and is expected cfg now
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
